[package]
name = "r-dlp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Focused YouTube audio resolver for Glyph companion"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
