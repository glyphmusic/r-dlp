name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: v0.1.1
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test and build
        run: |
          cargo test --locked --target ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          VERSION="${RELEASE_TAG#v}"
          NAME="r-dlp-${VERSION}-${{ matrix.target }}"
          mkdir -p dist/stage
          BIN=r-dlp; [ "${{ runner.os }}" = "Windows" ] && BIN=r-dlp.exe
          test "$(target/${{ matrix.target }}/release/$BIN --version)" = "$VERSION"
          cp "target/${{ matrix.target }}/release/$BIN" README.md LICENSE dist/stage/
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist/stage && 7z a -tzip "../$NAME.zip" . > /dev/null)
            ASSET="$NAME.zip"
          else
            tar -C dist/stage -czf "dist/$NAME.tar.gz" .
            ASSET="$NAME.tar.gz"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify, sign and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GLYPH_RELEASE_KEY: ${{ secrets.GLYPH_RELEASE_KEY }}
        run: python3 scripts/publish-release.py rdlp "$RELEASE_TAG" "${{ github.repository }}" release-assets
