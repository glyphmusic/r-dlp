# Keeps the release build cache warm. GitHub only lets a tag run restore
# caches from its own tag or from main, so release.yml (save-if: false)
# restores what this workflow saves on main. rust-cache stores the compiled
# dependencies, which take most of the build time.
# Matrix, commands, toolchain and env must match release.yml, or the keys differ.
name: Release cache

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/release-cache.yml
  # Fridays: picks up a new stable Rust (released on Thursdays) and keeps the
  # caches alive, since GitHub drops caches unused for 7 days.
  schedule:
    - cron: "0 4 * * 5"
  workflow_dispatch:

concurrency:
  group: release-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      # Same commands as release.yml: the tests need the dev-profile
      # dependencies, the release build the optimized ones.
      - name: Test and build
        run: |
          cargo test --locked --target ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
